<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Saturn Simulator — Stable Sun, Rings & Drake Cube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: system-ui, sans-serif;
    }
    #info {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #ccc;
      font-size: 13px;
      opacity: 0.9;
      z-index: 10;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="info">Visible Sun • Saturn • Drake Cube<br>Drag = rotate • Scroll = zoom</div>

<!-- Three.js r124 (NO modules) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // ===================== SCENE =====================

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
  camera.position.set(0, 3, 14);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;

  // ===================== LIGHTING =====================

  var sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
  sunLight.position.set(10, 0, 0);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x111111));

  // ===================== SUN =====================

  var sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 48, 48),
    new THREE.MeshBasicMaterial({
      map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/sun.jpg')
    })
  );
  sun.position.set(10, 0, 0);
  scene.add(sun);

  // ===================== SATURN =====================

  var loader = new THREE.TextureLoader();

  var saturn = new THREE.Mesh(
    new THREE.SphereGeometry(1.8, 128, 128),
    new THREE.MeshPhongMaterial({
      map: loader.load('https://th.bing.com/th/id/OIP.c0lBCBMdk6x2yYLpKhV5swHaFj?w=218&h=182&c=7&r=0&o=5&cb=ucfimg2&pid=1.7&ucfimg=1'),
      shininess: 2
    })
  );
  saturn.rotation.z = THREE.Math.degToRad(26.7);
  scene.add(saturn);

  // ===================== SATURN RINGS =====================

  var ringGeo = new THREE.RingGeometry(2.2, 3.9, 256);
  var ringMat = new THREE.MeshBasicMaterial({
    map: loader.load('https://tse4.mm.bing.net/th/id/OIP.pM8t8KZlIt-JDZEMey0t8AHaHa?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3'),
    side: THREE.DoubleSide,
    transparent: true
  });

  var rings = new THREE.Mesh(ringGeo, ringMat);
  rings.rotation.x = Math.PI / 2;
  rings.rotation.z = THREE.Math.degToRad(26.7);
  saturn.add(rings);

  // ===================== DRAKE CUBE =====================

  var drakeCube = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({
      map: loader.load('https://townsquare.media/site/812/files/2021/07/attachment-drake1.jpg?w=1200'),
      roughness: 0.4,
      metalness: 0.2
    })
  );

  drakeCube.position.set(4, 0, 0); // next to Kanye planet (Saturn)
  scene.add(drakeCube);

  // ===================== STARS =====================

  var starsGeo = new THREE.BufferGeometry();
  var starCount = 12000;
  var positions = new Float32Array(starCount * 3);

  for (var i = 0; i < starCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 4000;
  }

  starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  var stars = new THREE.Points(
    starsGeo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })
  );
  scene.add(stars);

  // ===================== ASTRONOMY =====================

  var cycleStart = Date.now();
  var CYCLE_DURATION = 15000;

  function updateSun() {
    var elapsed = (Date.now() - cycleStart) % CYCLE_DURATION;
    var angle = (elapsed / CYCLE_DURATION) * Math.PI * 2;

    var x = Math.cos(angle) * 12;
    var z = Math.sin(angle) * 12;

    sun.position.set(x, 0, z);
    sunLight.position.set(x, 0, z);
  }

  // ===================== RESIZE =====================

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ===================== LOOP =====================

  function animate() {
    requestAnimationFrame(animate);

    saturn.rotation.y += 0.0004;
    drakeCube.rotation.y += 0.01;
    drakeCube.rotation.x += 0.005;

    updateSun();
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
