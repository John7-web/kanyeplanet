<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Saturn Simulator — Drake Impact (Lil Baby Explosion)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #info {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #ccc;
      font-size: 13px;
      opacity: 0.9;
      z-index: 10;
      text-align: center;
    }
    #resetBtn {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #111;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://avatars.githubusercontent.com/u/5605614?v=4') center center / cover no-repeat;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.06s ease-out;
    }
  </style>
</head>
<body>
<div id="flash"></div>
<div id="info">Drake Cube → Kanye Planet (Saturn)<br>Drag = rotate • Scroll = zoom</div>
<button id="resetBtn">Reset Explosion</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.124.0/examples/js/controls/OrbitControls.js"></script>

<script>
var scene, camera, renderer, controls;
var sun, sunLight, saturn, rings;
var drakeCubes = [];
var moons = [];
var ejectedMoons = [];
var explosionParticles = null;
var impactHappened = false;
var meteorVelocity = new THREE.Vector3(-0.03, 0, 0);
var animationId;
var slowMotion = false;
var timeScale = 1;
var timeRampStart = 0;
var timeRampDuration = 700;

function initScene() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
  camera.position.set(0, 3, 14);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;

  sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x111111));

  var texLoader = new THREE.TextureLoader();

  sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 48, 48),
    new THREE.MeshStandardMaterial({
      map: texLoader.load('https://media.licdn.com/dms/image/v2/C5603AQHFrp-bujAh5g/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1516969759342?e=1770249600&v=beta&t=GshB2WfcK75EsgxNN7rhiPI7TMRwGxC3Vpo7VqJWCRA'),
      emissive: new THREE.Color(0xffaa33),
      emissiveMap: texLoader.load('https://i.pinimg.com/736x/05/89/13/0589130247c9a818bb3a4db50e5baa0f.jpg'),
      emissiveIntensity: 1.2
    })
  );
  scene.add(sun);

  saturn = new THREE.Mesh(
    new THREE.SphereGeometry(1.8, 128, 128),
    new THREE.MeshPhongMaterial({
      map: texLoader.load('https://avatars.githubusercontent.com/u/5605614?v=4'),
      shininess: 2
    })
  );
  saturn.rotation.z = THREE.Math.degToRad(26.7);
  scene.add(saturn);

  rings = new THREE.Mesh(
    new THREE.RingGeometry(2.2, 3.9, 256),
    new THREE.MeshBasicMaterial({
      map: texLoader.load('https://tse4.mm.bing.net/th/id/OIP.pM8t8KZlIt-JDZEMey0t8AHaHa?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3'),
      side: THREE.DoubleSide,
      transparent: true
    })
  );
  rings.rotation.x = Math.PI / 2;
  rings.rotation.z = THREE.Math.degToRad(26.7);
  saturn.add(rings);

  for (var i = 0; i < 8; i++) {
    var pivot = new THREE.Object3D();
    pivot.rotation.x = THREE.MathUtils.randFloat(-0.4, 0.4);
    saturn.add(pivot);

    var moon = new THREE.Mesh(
      new THREE.SphereGeometry(THREE.MathUtils.randFloat(0.12, 0.38), 32, 32),
      new THREE.MeshStandardMaterial({
        map: texLoader.load('https://avatars.githubusercontent.com/u/5605614?v=4'),
        roughness: 1
      })
    );
    moon.position.x = 3.8 + i * 0.8;
    pivot.add(moon);
    moons.push({ pivot: pivot, speed: 0.001 + Math.random() * 0.0025, moon: moon });
  }

  // Spawn Drake cubes from all sides
  var spawnConfigs = [
    { pos: new THREE.Vector3( 15, 0, 0), vel: new THREE.Vector3(-0.03, 0, 0) }, // right
    { pos: new THREE.Vector3(-15, 0, 0), vel: new THREE.Vector3( 0.03, 0, 0) }, // left
    { pos: new THREE.Vector3( 0, 15, 0), vel: new THREE.Vector3( 0,-0.03, 0) }, // top
    { pos: new THREE.Vector3( 0,-15, 0), vel: new THREE.Vector3( 0, 0.03, 0) }, // bottom
    { pos: new THREE.Vector3( 0, 0, 15), vel: new THREE.Vector3( 0, 0,-0.03) }, // front
    { pos: new THREE.Vector3( 0, 0,-15), vel: new THREE.Vector3( 0, 0, 0.03) }  // back
  ];

  for (var s = 0; s < spawnConfigs.length; s++) {
    for (var i = 0; i < 3; i++) {
      var cube = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.2, 1.2),
        new THREE.MeshStandardMaterial({
          map: texLoader.load('https://avatars.githubusercontent.com/u/5605614?v=4'),
          roughness: 0.4,
          metalness: 0.2
        })
      );
      cube.position.copy(spawnConfigs[s].pos).add(new THREE.Vector3(
        THREE.MathUtils.randFloat(-2, 2),
        THREE.MathUtils.randFloat(-2, 2),
        THREE.MathUtils.randFloat(-2, 2)
      ));
      cube.userData.velocity = spawnConfigs[s].vel.clone();
      scene.add(cube);
      drakeCubes.push(cube);
    }
  }

  var starsGeo = new THREE.BufferGeometry();
  var count = 10000;
  var pos = new Float32Array(count * 3);
  for (var j = 0; j < pos.length; j++) pos[j] = (Math.random() - 0.5) * 4000;
  starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 })));
}

function animate() {
  animationId = requestAnimationFrame(animate);

  if (slowMotion) {
    var t = Math.min((performance.now() - timeRampStart) / timeRampDuration, 1);
    var eased = t * t * (3 - 2 * t);
    timeScale = Math.max(0.05, 0.15 + (1 - 0.15) * eased);
  } else {
    timeScale = 1;
  }

  if (!impactHappened) {
    saturn.rotation.y += 0.0004 * timeScale;
    for (var i = 0; i < moons.length; i++) {
      moons[i].pivot.rotation.y += moons[i].speed * timeScale;
    }
    for (var dc = 0; dc < drakeCubes.length; dc++) {
      var c = drakeCubes[dc];
      c.rotation.x += 0.01 * timeScale;
      c.rotation.y += 0.02 * timeScale;
      var v = c.userData.velocity || meteorVelocity;
      c.position.addScaledVector(v, timeScale);
      if (c.position.distanceTo(saturn.position) < 2.2) {
        triggerExplosion();
        break;
      }
    }
  } else {
    for (var k = 0; k < ejectedMoons.length; k++) {
      ejectedMoons[k].velocity.multiplyScalar(0.995);
      ejectedMoons[k].mesh.position.addScaledVector(ejectedMoons[k].velocity, timeScale);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

function triggerExplosion() {
  for (var i = 0; i < moons.length; i++) {
    var m = moons[i];
    var worldPos = new THREE.Vector3();
    m.moon.getWorldPosition(worldPos);
    scene.add(m.moon);
    m.moon.position.copy(worldPos);
    var dir = worldPos.clone().normalize();
    ejectedMoons.push({
      mesh: m.moon,
      velocity: dir.multiplyScalar(0.25 + Math.random() * 0.35)
    });
  }

  impactHappened = true;
  for (var dc = 0; dc < drakeCubes.length; dc++) scene.remove(drakeCubes[dc]);
  drakeCubes = [];
  scene.remove(saturn);

  var flash = document.getElementById('flash');
  var delays = [0, 120, 260];
  for (var d = 0; d < delays.length; d++) {
    (function(delay) {
      setTimeout(function() {
        flash.style.opacity = '1';
        setTimeout(function() { flash.style.opacity = '0'; }, 80);
      }, delay);
    })(delays[d]);
  }

  // Spawn MORE Drake cubes AFTER explosion (from chaos zone)
  var texLoader = new THREE.TextureLoader();

  function spawnCubeWave(count, radius, speed) {
    for (var i = 0; i < count; i++) {
      var cube = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 1.1, 1.1),
        new THREE.MeshStandardMaterial({
          map: texLoader.load('https://media.licdn.com/dms/image/v2/C5603AQHFrp-bujAh5g/profile-displayphoto-shrink_200_200/profile-displayphoto-shrink_200_200/0/1516969759342?e=1770249600&v=beta&t=GshB2WfcK75EsgxNN7rhiPI7TMRwGxC3Vpo7VqJWCRA'),
          roughness: 0.4,
          metalness: 0.2
        })
      );
      cube.position.set(
        THREE.MathUtils.randFloatSpread(radius),
        THREE.MathUtils.randFloatSpread(radius),
        THREE.MathUtils.randFloatSpread(radius)
      );
      cube.userData.velocity = new THREE.Vector3(
        THREE.MathUtils.randFloatSpread(speed),
        THREE.MathUtils.randFloatSpread(speed),
        THREE.MathUtils.randFloatSpread(speed)
      );
      scene.add(cube);
      drakeCubes.push(cube);
    }
  }

  // Immediate chaos burst
  spawnCubeWave(16, 6, 0.25);

  // Secondary wave
  setTimeout(function() {
    spawnCubeWave(20, 10, 0.18);
  }, 400);

  // Final heavy wave
  setTimeout(function() {
    spawnCubeWave(28, 14, 0.12);
  }, 900);

  // EXTRA chaos waves (escalation)
  setTimeout(function() {
    spawnCubeWave(36, 18, 0.16);
  }, 1400);

  setTimeout(function() {
    spawnCubeWave(48, 22, 0.14);
  }, 2000);

  setTimeout(function() {
    spawnCubeWave(64, 28, 0.1);
  }, 2800);

  // OVERDRIVE waves (even more)
  setTimeout(function() {
    spawnCubeWave(96, 36, 0.12);
  }, 3600);

  setTimeout(function() {
    spawnCubeWave(128, 48, 0.09);
  }, 4600);

  // Sustained chaos drizzle
  var dripCount = 0;
  var dripInterval = setInterval(function() {
    if (dripCount++ > 12) {
      clearInterval(dripInterval);
      return;
    }
    spawnCubeWave(24, 40, 0.07);
  }, 600);

  slowMotion = true;
  timeRampStart = performance.now();
}

function resetSimulation() {
  cancelAnimationFrame(animationId);
  while (scene.children.length) scene.remove(scene.children[0]);
  moons = [];
  ejectedMoons = [];
  impactHappened = false;
  slowMotion = false;
  meteorVelocity.set(-0.03, 0, 0);
  initScene();
  animate();
}

document.getElementById('resetBtn').onclick = resetSimulation;
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

initScene();
animate();
</script>
</body>
</html>
